name: Update contribution counts

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-contributions.yml
      - scripts/update_contributions.py
      - tests/**
      - README.md

permissions:
  contents: read

concurrency:
  group: contribution-counts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test contribution updates
        run: python3 -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Update contribution paragraph
        env:
          EPARENTI_CONTRIBUTIONS_TOKEN: ${{ secrets.EPARENTI_CONTRIBUTIONS_TOKEN }}
          TEMPO_CONTRIBUTIONS_TOKEN: ${{ secrets.TEMPO_CONTRIBUTIONS_TOKEN }}
        run: python3 scripts/update_contributions.py
      - name: Commit the updated paragraph
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update contribution counts'
          git push origin HEAD:main
